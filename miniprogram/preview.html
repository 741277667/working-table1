<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>慢慢来 · 小程序交互预览</title>
<style>
:root{--desk:#eee9dd;--ink:#39342e;--muted:#8b8173;--line:#c9beaa;--paper:#f4efdf}*{box-sizing:border-box}body{margin:0;background:#ded8cb;color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.preview-note{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:9;padding:5px 10px;border:1px solid #b8ad9b;background:#f4f0e6;color:#786e60;font-size:10px;white-space:nowrap;box-shadow:1px 2px 4px #45382120}.phone{width:min(100vw,420px);height:min(100dvh,900px);min-height:620px;margin:38px auto 20px;overflow:hidden;border:1px solid #c5bcad;border-radius:26px;background:var(--desk);box-shadow:0 12px 36px #3a30201e;display:flex;flex-direction:column}.topbar{height:54px;flex:none;padding:0 17px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #d9d1c2}.brand{font:19px Georgia,serif}.brand small{font:9px sans-serif;letter-spacing:.14em;color:var(--muted);margin-left:5px}.tools{display:flex;gap:6px}.tools button{width:32px;height:32px;border:1px solid #b8ad9b;background:#f4f0e6;font-size:18px}.main{flex:1;min-height:0;overflow:auto;padding:19px 16px 24px}.heading{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:17px}.eyebrow{display:block;color:#948a79;font-size:9px;letter-spacing:.17em;margin-bottom:5px;text-transform:uppercase}.title{font:26px/1.15 Georgia,"Songti SC",serif}.back{display:block;margin-bottom:8px;color:#7b6f5d;font-size:11px;background:none;border:0;padding:0}.save{font-size:10px;color:var(--muted)}.zones,.folders,.papers{display:flex;flex-direction:column;gap:12px}.zone{padding:14px;border:1px solid var(--line);background:#e6dfd0;box-shadow:0 3px 6px #493d2c17;min-height:124px}.zone:nth-child(2){background:#e4e4dd}.zone:nth-child(3){background:#e8ded6}.zone:nth-child(4){background:#dedfd7}.zone:nth-child(5){background:#e6dec9}.zone-head{display:flex;justify-content:space-between}.zone-name{font:21px Georgia,"Songti SC",serif}.zone-en{display:block;margin-top:3px;color:#958a78;font-size:8px;letter-spacing:.15em}.minipapers{display:flex;gap:7px;overflow:hidden;margin:11px 0 8px}.minipaper{min-width:100px;max-width:45%;height:34px;padding:5px 7px;border:1px solid #d4c9b4;background:var(--paper);box-shadow:1px 2px 3px #4237281c;font:12px Georgia,"Songti SC",serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transform:rotate(-.6deg)}.minipaper:nth-child(even){transform:rotate(.8deg)}.zone-meta{font-size:9px;color:var(--muted)}.folder{position:relative;display:flex;align-items:center;min-height:61px;padding:16px 13px 9px;border:1px solid #c8b99f;background:#e8dfcd;box-shadow:0 2px 4px #4538211c;cursor:pointer}.folder:before{content:"";position:absolute;top:-1px;left:12px;width:52px;height:9px;background:#d9c9aa;border:1px solid #c8b99f;border-bottom:0}.folder-name{font:16px Georgia,"Songti SC",serif;flex:1}.folder-count{font-size:10px;color:var(--muted);margin-right:10px}.arrow{font-size:18px;color:#88765d}.paper{position:relative;display:flex;flex-direction:column;gap:7px;padding:14px;border:1px solid #d4c9b4;background:var(--paper);box-shadow:1px 3px 5px #4137251d;transform:rotate(-.25deg);cursor:pointer}.paper:nth-child(even){transform:rotate(.2deg)}.paper:nth-child(3n+2){background:#f1e4bb}.paper.blue{background:#e4ebec}.paper .type{font-size:8px;letter-spacing:.18em;color:#968a75}.paper .ptitle{font:17px Georgia,"Songti SC",serif}.summary{font-size:12px;line-height:1.55;color:#756c60;white-space:pre-wrap}.empty{text-align:center;color:var(--muted);font-size:12px;padding:22px}.composer{flex:none;display:flex;align-items:center;gap:9px;margin:10px 15px 12px;padding:9px 10px;border:1px solid #cbbda4;background:#f3eddd;box-shadow:0 2px 5px #493d2c16}.composer input,.check-composer input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:14px}.composer button{padding:6px 10px;border-left:1px solid #d4c9b4;background:none;color:#766750;font-size:11px}.tabbar{height:62px;flex:none;display:flex;align-items:center;justify-content:space-around;border-top:1px solid #d4c9b4;background:#f1ecdf;padding-bottom:env(safe-area-inset-bottom)}.tabbar button{width:25%;display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:none;font-size:9px;color:var(--muted)}.tabbar button b{font-size:18px;font-weight:400}.tabbar .active{color:#574d3f}.detail-paper{padding:16px;border:1px solid #d4c9b4;background:#f4efdf;box-shadow:1px 3px 6px #41372520;transform:rotate(-.2deg)}.detail-paper input{width:100%;padding:9px 0;margin:8px 0 12px;border:0;border-bottom:1px solid #d8cebd;background:transparent;font:23px Georgia,"Songti SC",serif}.detail-paper textarea{width:100%;min-height:110px;resize:vertical;border:0;background:transparent;font:13px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;outline:0}.label{display:block;margin:18px 0 8px;font-size:10px;color:#897d6b;letter-spacing:.12em}.check-row{display:flex;align-items:center;gap:10px;padding:9px 3px;border-bottom:1px solid #dcd4c5}.check-row input{accent-color:#897b64}.check-composer{display:flex;gap:8px;padding:10px 4px;border-bottom:1px solid #c8b99f;color:#8c795d}.action{margin:20px 0;padding:10px;width:100%;border:1px solid #b9aa91;background:#f2ecde;font-size:11px}.drag{position:fixed;z-index:20;pointer-events:none;padding:14px;min-width:140px;background:#f4efdf;border:1px solid #cfc3ad;box-shadow:2px 10px 18px #342a1e54;transform:rotate(-4deg) scale(1.04)}@media(max-width:500px){body{background:var(--desk)}.preview-note{top:3px}.phone{width:100vw;height:100dvh;min-height:0;margin:0;border:0;border-radius:0;box-shadow:none}.main{padding-top:22px}}
</style></head><body><div class="preview-note">交互预览 · 浏览器模拟，非微信真机</div><div class="phone"><header class="topbar"><div class="brand">慢慢来 <small>PERSONAL DESK</small></div><div class="tools"><button aria-label="搜索" onclick="search()">⌕</button><button aria-label="导入备份" onclick="importData()">↑</button><button aria-label="导出备份" onclick="exportData()">↓</button></div></header><main id="main" class="main"></main><div id="composer"></div><nav class="tabbar"><button data-nav="desk" onclick="goDesk()"><b>⌂</b>桌面</button><button data-nav="today" onclick="goTray('today')"><b>◷</b>TODAY</button><button data-nav="inbox" onclick="goTray('inbox')"><b>▤</b>INBOX</button><button data-nav="archive" onclick="goTray('archive')"><b>▱</b>Archive</button></nav></div><div id="drag"></div>
<script>
const zones=[{id:'media',name:'自媒体',en:'THE EDITORIAL',modules:['灵感纸篓','选题库','当前制作','素材文件格']},{id:'thesis',name:'毕业设计',en:'RESEARCH STUDIO',modules:['当前研究','问题纸堆','灵感碎纸','资料文件格']},{id:'freelance',name:'兼职',en:'SIDE PROJECTS',modules:['IN · 新任务','WORKING · 制作中','DELIVERED · 已交付']},{id:'work',name:'工作',en:'WHAT’S NEXT',modules:['实习 · 短期任务','校招 · WANT','校招 · PROCESS']},{id:'life',name:'生活',en:'LITTLE THINGS',modules:['日常小事','购物清单','想买','最近想做']}];
const key='personal-desk-preview';let state=JSON.parse(localStorage.getItem(key)||'null')||{cards:[{id:'seed-list',title:'把日子过得具体一点',summary:'鲜花、咖啡，还有好好吃饭。',type:'LIST',home_area:'life',home_module:'购物清单',surface:'home',lane:'TODAY',status:'ACTIVE',notes:'',checklist:[{id:'a',text:'买一束鲜花',done:false},{id:'b',text:'补充咖啡豆',done:true},{id:'c',text:'去公园散步',done:false}],visual_dna:{family:'warm-yellow',rotation:1}},{id:'seed-note',title:'让灵感先发生',summary:'把生活里的小发现攒成下一次表达。',type:'NOTE',home_area:'media',home_module:'灵感纸篓',surface:'home',lane:'TODAY',status:'ACTIVE',notes:'',checklist:[],visual_dna:{family:'warm-yellow',rotation:-1}},{id:'seed-inbox',title:'想研究 AI × 设计岗位',summary:'先记下来，慢慢整理。',type:'NOTE',home_area:null,home_module:null,surface:'inbox',lane:'TODAY',status:'ACTIVE',notes:'',checklist:[],visual_dna:{family:'soft-blue',rotation:1}}]};let screen='desk',area='life',folder='购物清单',nav='desk',selected=null;
function save(){localStorage.setItem(key,JSON.stringify(state))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(c){return `<article class="paper" data-id="${esc(c.id)}" onclick="openCard('${esc(c.id)}')"><span class="type">${esc(c.type)}</span><span class="ptitle">${esc(c.title)}</span>${c.summary?`<span class="summary">${esc(c.summary)}</span>`:''}${c.type==='LIST'?`<span class="summary">${c.checklist.length} 个清单项</span>`:''}</article>`}
function head(title,sub=''){return `<div class="heading"><div>${sub?`<button class="back" onclick="back()">← ${esc(sub)}</button>`:''}<span class="eyebrow">${screen==='desk'?'MY LITTLE DESK':'PERSONAL DESK'}</span><span class="title">${esc(title)}</span></div><span class="save">仅保存在此浏览器</span></div>`}
function render(){const keepScroll=screen==='detail'?document.querySelector('#main').scrollTop:0;document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===nav));const m=document.querySelector('#main'),c=document.querySelector('#composer');c.innerHTML='';if(screen==='desk'){m.innerHTML=head('我的桌面')+`<section class="zones">${zones.map(z=>`<article class="zone" onclick="openArea('${z.id}')"><div class="zone-head"><div><span class="zone-name">${z.name}</span><span class="zone-en">${z.en}</span></div><span class="arrow">↗</span></div><div class="minipapers">${state.cards.filter(x=>x.home_area===z.id&&!['archive','trash'].includes(x.surface)).slice(0,2).map(x=>`<span class="minipaper" onclick="event.stopPropagation();openCard('${x.id}')">${esc(x.title)}</span>`).join('')||'<span class="zone-meta">还没有纸片</span>'}</div><span class="zone-meta">打开文件夹　·　${z.name}</span></article>`).join('')}</section>`}
else if(screen==='project'){const z=zones.find(x=>x.id===area);m.innerHTML=head(z.name,'桌面')+`<section class="folders">${z.modules.map(n=>`<article class="folder" onclick="openFolder('${esc(n)}')"><span class="folder-name">${esc(n)}</span><span class="folder-count">${state.cards.filter(x=>x.home_area===area&&x.home_module===n&&!['archive','trash'].includes(x.surface)).length} 张纸</span><span class="arrow">→</span></article>`).join('')}</section>`}
else if(screen==='folder'){const cards=state.cards.filter(x=>x.home_area===area&&x.home_module===folder&&!['archive','trash'].includes(x.surface));m.innerHTML=head(folder,zones.find(x=>x.id===area).name)+`<section class="papers">${cards.map(card).join('')||'<div class="empty">文件夹还是空的，写下第一件小事吧。</div>'}</section>`;c.innerHTML=`<div class="composer"><span>＋</span><input id="new-paper" placeholder="添加一条……" autocomplete="off"><button onclick="addPaper()">收好</button></div>`;const input=document.querySelector('#new-paper');input?.focus();input?.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();addPaper()}})}
else if(screen==='detail'){const x=state.cards.find(x=>x.id===selected);m.innerHTML=head(x.type,'返回')+`<section class="detail-paper"><span class="type">${esc(x.type)}</span><input id="title-edit" value="${esc(x.title)}" aria-label="纸片标题"><textarea id="note-edit" placeholder="在这里展开这一页……">${esc(x.notes||'')}</textarea></section>${x.type==='LIST'?`<span class="label">清单</span><section id="check-list">${x.checklist.map(i=>`<label class="check-row"><input type="checkbox" ${i.done?'checked':''} onchange="toggle('${i.id}')">${esc(i.text)}</label>`).join('')}</section><div class="check-composer"><span>＋</span><input id="new-check" placeholder="添加清单项"><span>Enter 添加</span></div>`:''}<button class="action" onclick="finish()">✓ 完成并归档</button><button class="action" onclick="trash()">丢入废纸篓</button>`;const ti=document.querySelector('#title-edit'),ni=document.querySelector('#note-edit');ti.oninput=()=>{x.title=ti.value;save()};ni.oninput=()=>{x.notes=ni.value;save()};if(x.type==='LIST'){const ci=document.querySelector('#new-check');ci.focus();ci.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();addCheck()}}}}
else if(screen==='tray'){let cards=state.cards.filter(x=>x.surface===nav&&(nav!=='today'||x.lane==='TODAY'));m.innerHTML=head(nav==='today'?'TODAY':nav==='inbox'?'INBOX':nav==='archive'?'ARCHIVE':nav==='trash'?'废纸篓':'搜索','桌面')+`<section class="papers">${cards.map(card).join('')||'<div class="empty">这里暂时没有纸片。</div>'}</section>${nav==='archive'?'<button class="action" onclick="goTray(\'trash\')">打开废纸篓</button>':''}`}
else if(screen==='search'){m.innerHTML=head('搜索','桌面')+`<div class="composer"><input id="search-box" placeholder="搜索标题、描述与笔记"></div><section id="search-results" class="papers"></section>`;document.querySelector('#search-box').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelector('#search-results').innerHTML=state.cards.filter(x=>x.surface!=='trash'&&`${x.title} ${x.summary} ${x.notes}`.toLowerCase().includes(q)).map(card).join('')}}m.scrollTop=keepScroll}
function openArea(id){area=id;screen='project';nav='desk';render()}function openFolder(name){folder=name;screen='folder';render()}function openCard(id){selected=id;screen='detail';render()}function back(){if(screen==='detail'){screen=folder?'folder':area?'project':'tray'}else if(screen==='folder')screen='project';else screen='desk';render()}function goDesk(){screen='desk';area=null;folder='';nav='desk';render()}function goTray(n){screen='tray';nav=n;area=null;folder='';render()}function search(){screen='search';area=null;folder='';nav='';render()}
function addPaper(){const input=document.querySelector('#new-paper'),title=input.value.trim();if(!title)return;state.cards.push({id:crypto.randomUUID(),title,summary:'',type:'NOTE',home_area:area,home_module:folder,surface:'home',lane:'TODAY',status:'ACTIVE',notes:'',checklist:[],visual_dna:{family:'cream-index',rotation:(Math.random()-.5)*3}});save();render()}
function addCheck(){const x=state.cards.find(x=>x.id===selected),input=document.querySelector('#new-check'),text=input.value.trim();if(!text)return;x.checklist.push({id:crypto.randomUUID(),text,done:false});save();render();document.querySelector('#new-check').focus()}
function toggle(id){const x=state.cards.find(x=>x.id===selected),i=x.checklist.find(i=>i.id===id);i.done=!i.done;save()}
function finish(){const x=state.cards.find(x=>x.id===selected);x.surface='archive';x.status='DONE';save();back()}
function trash(){const x=state.cards.find(x=>x.id===selected);x.surface='trash';save();back()}
function exportData(){const a=document.createElement('a'),blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download='personal-desk-preview.json';a.click();URL.revokeObjectURL(a.href)}function importData(){const i=document.createElement('input');i.type='file';i.accept='application/json';i.onchange=async()=>{try{const x=JSON.parse(await i.files[0].text());if(!Array.isArray(x.cards))throw Error();state=x;save();goDesk()}catch{alert('不是有效的桌面备份')}};i.click()}
render();
</script></body></html>
